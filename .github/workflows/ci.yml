name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x pane-status.tmux scripts/helpers.sh modules/*/load.sh modules/agent/agent-status modules/gh/gh-status tests/run.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported tmux.
          - os: ubuntu-latest
            tmux: "3.8"
          # macOS system bash 3.2.
          - os: macos-latest
            tmux: package
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev
            curl -fsSL "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" | tar xz
            (cd "tmux-$TMUX_VERSION" && ./configure && make -j"$(nproc)" && sudo make install)
          fi
      - name: Use /bin/bash for env bash on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - run: tmux -V && bash --version | head -n 1
      - run: tests/run.sh
